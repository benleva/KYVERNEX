name: KYVERNEX KGO v3

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Governance execution mode
        required: true
        default: autonomous
        type: choice
        options:
          - autonomous
          - verify-only
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/kgo.yml"

permissions:
  contents: read
  issues: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  kgo:
    name: KGO v3 governed autonomous loop
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install KYVERNEX and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run M3-W003 targeted tests
        id: targeted_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m pytest -q tests/test_self_verification.py 2>&1 | tee artifacts/targeted-pytest-output.txt

      - name: Run complete test suite
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m pytest -q 2>&1 | tee artifacts/pytest-output.txt

      - name: Evaluate continuous self-verification
        if: always()
        env:
          TARGETED_OUTCOME: ${{ steps.targeted_tests.outcome }}
          COMPLETE_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from kyvernex.self_verification import ContinuousSelfVerificationController, write_verification_result

          result = ContinuousSelfVerificationController().evaluate(
              work_item_id="M3-W003",
              targeted_output=Path("artifacts/targeted-pytest-output.txt").read_text(encoding="utf-8", errors="replace"),
              targeted_outcome=os.environ.get("TARGETED_OUTCOME", "unknown"),
              complete_output=Path("artifacts/pytest-output.txt").read_text(encoding="utf-8", errors="replace"),
              complete_outcome=os.environ.get("COMPLETE_OUTCOME", "unknown"),
          )
          write_verification_result(result, "artifacts/SELF_VERIFICATION.json")
          summary = [
              "## Continuous self-verification",
              "",
              f"- Work item: `{result.work_item_id}`",
              f"- Status: **{result.status}**",
              f"- Reason: `{result.reason}`",
              f"- Next action: {result.next_action}",
          ]
          Path("artifacts/SELF_VERIFICATION_SUMMARY.md").write_text("\n".join(summary) + "\n", encoding="utf-8")
          PY
          cat artifacts/SELF_VERIFICATION_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build KGO v1 governed backlog
        if: always()
        run: |
          python -m kyvernex.kgo_ci artifacts/pytest-output.txt --output-dir artifacts
          cat artifacts/KGO_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build KGO v2 root-cause plan
        if: always()
        run: |
          python -m kyvernex.kgo_v2 artifacts/pytest-output.txt --output-dir artifacts
          cat artifacts/KGO_V2_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate KGO v3 current-evidence loop
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python -m kyvernex.kgo_v3 artifacts/pytest-output.txt \
            --state artifacts/KGO_STATE.json \
            --output-dir artifacts \
            --test-outcome "$TEST_OUTCOME" \
            --commit "$GITHUB_SHA" \
            --work-item "M3-W003"
          cat artifacts/KGO_V3_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Plan next M3 autonomous development cycle
        if: steps.targeted_tests.outcome == 'success' && steps.tests.outcome == 'success' && (github.event.inputs.mode || 'autonomous') == 'autonomous'
        run: |
          python -m kyvernex.ade_cli --artifact-directory artifacts
          echo "## M3 autonomous development" >> "$GITHUB_STEP_SUMMARY"
          echo "The next policy-bounded development cycle is available in ADE_CYCLE_PLAN.json." >> "$GITHUB_STEP_SUMMARY"

      - name: Produce CI evidence record
        if: always()
        env:
          KGO_MODE: ${{ github.event.inputs.mode || 'autonomous' }}
          TARGETED_OUTCOME: ${{ steps.targeted_tests.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          evidence = {
              "schema": "kyvernex.kgo.evidence.v5",
              "mode": os.environ.get("KGO_MODE", "autonomous"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "commit": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "targeted_test_outcome": os.environ.get("TARGETED_OUTCOME", "unknown"),
              "test_outcome": os.environ.get("TEST_OUTCOME", "unknown"),
              "verified_at": datetime.now(timezone.utc).isoformat(),
              "ci_provider": "github-actions",
              "governance_engine": "KGO_V3_ADE_M3_SELF_VERIFICATION",
          }
          Path("artifacts/KGO_EVIDENCE.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create or update governed blocker issue
        if: always() && (steps.targeted_tests.outcome != 'success' || steps.tests.outcome != 'success') && (github.event.inputs.mode || 'autonomous') == 'autonomous'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="KGO v3 blocker: current governed evidence"
          body_file="artifacts/SELF_VERIFICATION_SUMMARY.md"
          issue_number="$(gh issue list --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "KGO v3 blocker: current governed evidence") | .number' | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file"
          fi

      - name: Upload KGO v3 governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kgo-v3-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce governed result
        if: always()
        env:
          TARGETED_OUTCOME: ${{ steps.targeted_tests.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [ "$TARGETED_OUTCOME" != "success" ] || [ "$TEST_OUTCOME" != "success" ]; then
            echo "KGO_V3_BLOCKED: current verification evidence recorded."
            exit 1
          fi
          echo "KGO_V3_VERIFIED: targeted and complete suites passed for commit $GITHUB_SHA."
