name: KYVERNEX KGO

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Governance execution mode
        required: true
        default: autonomous
        type: choice
        options:
          - autonomous
          - verify-only
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/kgo.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  kgo:
    name: KGO governed verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install KYVERNEX and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run complete test suite
        id: tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m pytest -q 2>&1 | tee artifacts/pytest-output.txt

      - name: Produce KGO evidence record
        if: always()
        shell: bash
        env:
          KGO_MODE: ${{ github.event.inputs.mode || 'autonomous' }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          evidence = {
              "schema": "kyvernex.kgo.evidence.v1",
              "mode": os.environ.get("KGO_MODE", "autonomous"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "commit": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "test_outcome": os.environ.get("TEST_OUTCOME", "unknown"),
              "verified_at": datetime.now(timezone.utc).isoformat(),
              "ci_provider": "github-actions",
          }
          Path("artifacts").mkdir(exist_ok=True)
          Path("artifacts/KGO_EVIDENCE.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload KGO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kgo-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce governed result
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [ "$TEST_OUTCOME" != "success" ]; then
            echo "KGO_BLOCKED: complete test suite did not pass."
            exit 1
          fi
          echo "KGO_VERIFIED: complete test suite passed for commit $GITHUB_SHA."
