name: KYVERNEX KGO v2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Governance execution mode
        required: true
        default: autonomous
        type: choice
        options:
          - autonomous
          - verify-only
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/kgo.yml"

permissions:
  contents: read
  issues: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  kgo:
    name: KGO v2 governed verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install KYVERNEX and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run complete test suite
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m pytest -q 2>&1 | tee artifacts/pytest-output.txt

      - name: Build KGO v1 governed backlog
        if: always()
        shell: bash
        run: |
          python -m kyvernex.kgo_ci artifacts/pytest-output.txt --output-dir artifacts
          cat artifacts/KGO_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build KGO v2 root-cause and patch plan
        if: always()
        shell: bash
        run: |
          python -m kyvernex.kgo_v2 artifacts/pytest-output.txt --output-dir artifacts
          cat artifacts/KGO_V2_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Plan next M3 autonomous development cycle
        if: steps.tests.outcome == 'success' && (github.event.inputs.mode || 'autonomous') == 'autonomous'
        shell: bash
        run: |
          python -m kyvernex.ade_cli --artifact-directory artifacts
          echo "## M3 autonomous development" >> "$GITHUB_STEP_SUMMARY"
          echo "The next policy-bounded development cycle is available in ADE_CYCLE_PLAN.json." >> "$GITHUB_STEP_SUMMARY"

      - name: Produce CI evidence record
        if: always()
        shell: bash
        env:
          KGO_MODE: ${{ github.event.inputs.mode || 'autonomous' }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          evidence = {
              "schema": "kyvernex.kgo.evidence.v3",
              "mode": os.environ.get("KGO_MODE", "autonomous"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "commit": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "test_outcome": os.environ.get("TEST_OUTCOME", "unknown"),
              "verified_at": datetime.now(timezone.utc).isoformat(),
              "ci_provider": "github-actions",
              "governance_engine": "KGO_V2_ADE_M3",
          }
          Path("artifacts/KGO_EVIDENCE.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create or update governed blocker issue
        if: always() && steps.tests.outcome != 'success' && (github.event.inputs.mode || 'autonomous') == 'autonomous'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="KGO v2 blocker: governed root-cause plan"
          body_file="artifacts/KGO_V2_SUMMARY.md"
          issue_number="$(gh issue list --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "KGO v2 blocker: governed root-cause plan") | .number' | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file"
          fi

      - name: Upload KGO v2 and M3 governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kgo-v2-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce governed result
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [ "$TEST_OUTCOME" != "success" ]; then
            echo "KGO_V2_BLOCKED: root causes and patch plans produced; merge remains prohibited."
            exit 1
          fi
          echo "KGO_V2_VERIFIED: complete test suite passed for commit $GITHUB_SHA."
