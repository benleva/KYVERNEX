name: KYVERNEX KGO v3

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Governance execution mode
        required: true
        default: autonomous
        type: choice
        options:
          - autonomous
          - verify-only
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "repository/specifications/**"
      - "pyproject.toml"
      - "LICENSE"
      - "README.md"
      - "CHANGELOG.md"
      - "PROJECT_STATUS.md"
      - "BACKLOG.md"
      - "SPRINT.md"
      - "QUALITY.md"
      - "KGO_CHECKPOINT.json"
      - ".github/workflows/kgo.yml"

permissions:
  contents: read
  issues: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  kgo:
    name: KGO v3 governed autonomous loop
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install KYVERNEX and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run M4 governance CLI targeted tests
        id: targeted_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m pytest -q tests/test_governance_cli.py tests/test_program_manager.py tests/test_kgo_v3.py 2>&1 | tee artifacts/targeted-pytest-output.txt

      - name: Run complete test suite
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m pytest -q 2>&1 | tee artifacts/pytest-output.txt

      - name: Evaluate continuous self-verification
        if: always()
        env:
          TARGETED_OUTCOME: ${{ steps.targeted_tests.outcome }}
          COMPLETE_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from kyvernex.self_verification import ContinuousSelfVerificationController, write_verification_result

          result = ContinuousSelfVerificationController().evaluate(
              work_item_id="M4-W007",
              targeted_output=Path("artifacts/targeted-pytest-output.txt").read_text(encoding="utf-8", errors="replace"),
              targeted_outcome=os.environ.get("TARGETED_OUTCOME", "unknown"),
              complete_output=Path("artifacts/pytest-output.txt").read_text(encoding="utf-8", errors="replace"),
              complete_outcome=os.environ.get("COMPLETE_OUTCOME", "unknown"),
          )
          write_verification_result(result, "artifacts/SELF_VERIFICATION.json")
          summary = [
              "## Continuous self-verification",
              "",
              f"- Work item: `{result.work_item_id}`",
              f"- Status: **{result.status}**",
              f"- Reason: `{result.reason}`",
              f"- Next action: {result.next_action}",
          ]
          Path("artifacts/SELF_VERIFICATION_SUMMARY.md").write_text("\n".join(summary) + "\n", encoding="utf-8")
          PY
          cat artifacts/SELF_VERIFICATION_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build KGO v1 governed backlog
        if: always()
        run: |
          python -m kyvernex.kgo_ci artifacts/pytest-output.txt --output-dir artifacts
          cat artifacts/KGO_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build KGO v2 root-cause plan
        if: always()
        run: |
          python -m kyvernex.kgo_v2 artifacts/pytest-output.txt --output-dir artifacts
          cat artifacts/KGO_V2_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate KGO v3 current-evidence loop
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python -m kyvernex.kgo_v3 artifacts/pytest-output.txt \
            --state artifacts/KGO_STATE.json \
            --output-dir artifacts \
            --test-outcome "$TEST_OUTCOME" \
            --commit "$GITHUB_SHA" \
            --work-item "M4-W007"
          cat artifacts/KGO_V3_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build release distributions
        id: package_build
        continue-on-error: true
        run: |
          python -m pip install build
          python -m build

      - name: Verify clean wheel installation and governance CLI
        id: clean_install
        continue-on-error: true
        shell: bash
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          .release-venv/bin/python -m pip install dist/*.whl
          .release-venv/bin/python - <<'PY'
          from importlib.metadata import version
          import kyvernex

          expected = "1.1.0rc1"
          assert version("kyvernex") == expected
          assert kyvernex.__version__ == expected
          print(f"KYVERNEX clean installation verified: {expected}")
          PY
          cat > /tmp/kyvernex-governance-plan.json <<'JSON'
          {
            "target_version": "1.1.0",
            "milestones": [
              {
                "milestone_id": "M4",
                "title": "Governed post-release evolution",
                "target_version": "1.1.0",
                "closed": false
              }
            ],
            "items": [
              {
                "item_id": "M4-SMOKE-001",
                "title": "Installed CLI smoke test",
                "milestone_id": "M4",
                "priority": "P0",
                "story_points": 1,
                "status": "READY",
                "dependencies": [],
                "done": {}
              }
            ]
          }
          JSON
          .release-venv/bin/kyvernex-governance start \
            --plan /tmp/kyvernex-governance-plan.json \
            --checkpoint /tmp/kyvernex-governance-checkpoint.json \
            > /tmp/kyvernex-governance-output.json
          .release-venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          output = json.loads(Path("/tmp/kyvernex-governance-output.json").read_text(encoding="utf-8"))
          checkpoint = json.loads(Path("/tmp/kyvernex-governance-checkpoint.json").read_text(encoding="utf-8"))
          assert output["current_item_id"] == "M4-SMOKE-001"
          assert output["state"] == "RUNNING"
          assert checkpoint == output
          assert "tests_passed" not in output
          assert "repository_written" not in output
          print("KYVERNEX governance console script verified")
          PY

      - name: Produce CI evidence record
        if: always()
        env:
          KGO_MODE: ${{ github.event.inputs.mode || 'autonomous' }}
          TARGETED_OUTCOME: ${{ steps.targeted_tests.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          PACKAGE_BUILD_OUTCOME: ${{ steps.package_build.outcome }}
          CLEAN_INSTALL_OUTCOME: ${{ steps.clean_install.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          evidence = {
              "schema": "kyvernex.kgo.evidence.v8",
              "mode": os.environ.get("KGO_MODE", "autonomous"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "commit": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "work_item": "M4-W007",
              "targeted_test_outcome": os.environ.get("TARGETED_OUTCOME", "unknown"),
              "test_outcome": os.environ.get("TEST_OUTCOME", "unknown"),
              "package_build_outcome": os.environ.get("PACKAGE_BUILD_OUTCOME", "unknown"),
              "clean_install_outcome": os.environ.get("CLEAN_INSTALL_OUTCOME", "unknown"),
              "verified_at": datetime.now(timezone.utc).isoformat(),
              "ci_provider": "github-actions",
              "governance_engine": "KGO_V3_M4_RELEASE_CANDIDATE_1_1",
          }
          Path("artifacts/KGO_EVIDENCE.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create or update governed blocker issue
        if: always() && (steps.targeted_tests.outcome != 'success' || steps.tests.outcome != 'success' || steps.package_build.outcome != 'success' || steps.clean_install.outcome != 'success') && (github.event.inputs.mode || 'autonomous') == 'autonomous'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="KGO v3 blocker: current governed evidence"
          body_file="artifacts/SELF_VERIFICATION_SUMMARY.md"
          issue_number="$(gh issue list --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "KGO v3 blocker: current governed evidence") | .number' | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file"
          fi

      - name: Upload KGO v3 governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kgo-v3-evidence-${{ github.run_id }}
          path: |
            artifacts/
            dist/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce governed result
        if: always()
        env:
          TARGETED_OUTCOME: ${{ steps.targeted_tests.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          PACKAGE_BUILD_OUTCOME: ${{ steps.package_build.outcome }}
          CLEAN_INSTALL_OUTCOME: ${{ steps.clean_install.outcome }}
        run: |
          if [ "$TARGETED_OUTCOME" != "success" ] || [ "$TEST_OUTCOME" != "success" ] || [ "$PACKAGE_BUILD_OUTCOME" != "success" ] || [ "$CLEAN_INSTALL_OUTCOME" != "success" ]; then
            echo "KGO_V3_BLOCKED: current M4 release-candidate evidence recorded."
            exit 1
          fi
          echo "KGO_V3_VERIFIED: M4 release candidate, complete suite, package build and clean installation passed for commit $GITHUB_SHA."
