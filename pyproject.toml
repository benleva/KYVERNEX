[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kyvernex"
version = "0.1.0.dev0"
description = "Reference prototype of the KYVERNEX cognitive governance plugin"
requires-python = ">=3.11"
authors = [{name = "Andrea Pernarcic"}]
license = {file = "LICENSE"}

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
kyvernex = "kyvernex.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
