[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kyvernex"
version = "1.2.0.dev0"
description = "KYVERNEX cognitive governance and execution engine for the ARGUS constitution"
requires-python = ">=3.11"
authors = [{name = "Andrea Pernarcic"}]
license = {file = "LICENSE"}

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
kyvernex = "kyvernex.cli:main"
kyvernex-governance = "kyvernex.governance_cli:main"
kyvernex-plugin = "kyvernex.plugin_cli:main"
kyvernex-ai-plugin = "kyvernex.ai_plugin_cli:main"
kyvernex-ai-server = "kyvernex.local_ai_server_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
