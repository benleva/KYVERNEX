[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kyvernex"
version = "1.2.0.dev0"
description = "Deterministic cognitive governance and plugin execution engine for the ARGUS constitution"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Andrea Pernarcic"}]
license = {file = "LICENSE"}
keywords = [
  "artificial-intelligence",
  "governance",
  "policy-engine",
  "plugin-runtime",
  "argus",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/benleva/KYVERNEX"
Repository = "https://github.com/benleva/KYVERNEX"
Issues = "https://github.com/benleva/KYVERNEX/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]
build = ["build>=1.2"]

[project.scripts]
kyvernex = "kyvernex.product_cli:main"
kyvernex-core = "kyvernex.cli:main"
kyvernex-governance = "kyvernex.governance_cli:main"
kyvernex-plugin = "kyvernex.plugin_cli:main"
kyvernex-ai-plugin = "kyvernex.ai_plugin_cli:main"
kyvernex-ai-server = "kyvernex.local_ai_server_cli:main"
kyvernex-ai-app = "kyvernex.local_ai_app_cli:main"
kyvernex-ai-setup = "kyvernex.local_ai_setup_cli:main"
kyvernex-ai-shortcut = "kyvernex.local_ai_shortcut_cli:main"
kyvernex-ai-project = "kyvernex.local_ai_project_cli:main"
kyvernex-ai-smoke = "kyvernex.local_ai_smoke_cli:main"
kyvernex-argus = "kyvernex.argus_matrix_cli:main"
kyvernex-argus-translate = "kyvernex.argus_translator_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
